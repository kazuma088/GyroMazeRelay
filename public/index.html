<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gyro Maze Controller</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;

            width: 100%;
            min-height: 100%;

            background: #101318;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .controller {

            width: min(
                100%,
                520px
            );
        }

        h1 {

            text-align: center;
        }

        .status {

            padding: 14px;

            margin-bottom: 12px;

            background: #1c222b;

            border-radius: 12px;

            text-align: center;
        }

        .values {

            display: grid;

            gap: 10px;
        }

        .value {

            display: flex;

            justify-content: space-between;

            padding: 14px;

            background: #1c222b;

            border-radius: 12px;
        }

        .number {

            font-family: monospace;
        }

        button {

            width: 100%;

            margin-top: 14px;

            padding: 16px;

            border: 0;

            border-radius: 12px;

            font-size: 17px;

            font-weight: bold;
        }

        #startButton {

            background: white;
            color: black;
        }

        #calibrateButton {

            background: #343d49;
            color: white;
        }

    </style>

</head>

<body>

<div class="controller">

    <h1>
        Gyro Maze Controller
    </h1>


    <div
        id="connectionStatus"
        class="status"
    >
        Unity接続待機中...
    </div>


    <div
        id="sensorStatus"
        class="status"
    >
        センサー未開始
    </div>


    <div class="values">

        <div class="value">

            <span>
                Alpha
            </span>

            <span
                id="alpha"
                class="number"
            >
                0.0°
            </span>

        </div>


        <div class="value">

            <span>
                Beta
            </span>

            <span
                id="beta"
                class="number"
            >
                0.0°
            </span>

        </div>


        <div class="value">

            <span>
                Gamma
            </span>

            <span
                id="gamma"
                class="number"
            >
                0.0°
            </span>

        </div>

    </div>


    <button id="startButton">
        センサー開始
    </button>


    <button id="calibrateButton">
        この向きを基準にする
    </button>

</div>


<script>

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const sensorStatus =
    document.getElementById(
        "sensorStatus"
    );

const alphaElement =
    document.getElementById(
        "alpha"
    );

const betaElement =
    document.getElementById(
        "beta"
    );

const gammaElement =
    document.getElementById(
        "gamma"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const calibrateButton =
    document.getElementById(
        "calibrateButton"
    );


// ==================================================
// WebSocket
// ==================================================

const pageParameters =
    new URLSearchParams(
        window.location.search
    );

const roomName =
    pageParameters.get("room")
    || "demo";

let socket = null;


function connectWebSocket() {

    const protocol =
        window.location.protocol === "https:"
        ? "wss:"
        : "ws:";

    const url =
        protocol
        + "//"
        + window.location.host
        + "/ws"
        + "?room="
        + encodeURIComponent(roomName)
        + "&role=phone";


    connectionStatus.textContent =
        "サーバー接続中...";


    socket =
        new WebSocket(url);


    socket.addEventListener(
        "open",
        () => {

            connectionStatus.textContent =
                "接続済み / Room: "
                + roomName;
        }
    );


    socket.addEventListener(
        "close",
        () => {

            connectionStatus.textContent =
                "切断 / 再接続中...";

            setTimeout(
                connectWebSocket,
                2000
            );
        }
    );


    socket.addEventListener(
        "error",
        () => {

            connectionStatus.textContent =
                "通信エラー";
        }
    );
}


// ==================================================
// Vector
// ==================================================

function vectorLength(v) {

    return Math.sqrt(
        v.x * v.x
        + v.y * v.y
        + v.z * v.z
    );
}


function normalizeVector(v) {

    const length =
        vectorLength(v);


    if (length < 0.000001) {

        return {
            x: 0,
            y: 0,
            z: 0
        };
    }


    return {

        x: v.x / length,
        y: v.y / length,
        z: v.z / length
    };
}


function dotVector(a, b) {

    return (
        a.x * b.x
        + a.y * b.y
        + a.z * b.z
    );
}


function crossVector(a, b) {

    return {

        x:
            a.y * b.z
            - a.z * b.y,

        y:
            a.z * b.x
            - a.x * b.z,

        z:
            a.x * b.y
            - a.y * b.x
    };
}


// ==================================================
// Quaternion
// ==================================================

function normalizeQuaternion(q) {

    const length =
        Math.sqrt(
            q.x * q.x
            + q.y * q.y
            + q.z * q.z
            + q.w * q.w
        );


    if (length < 0.000001) {

        return {
            x: 0,
            y: 0,
            z: 0,
            w: 1
        };
    }


    return {

        x: q.x / length,
        y: q.y / length,
        z: q.z / length,
        w: q.w / length
    };
}


function multiplyQuaternion(a, b) {

    return {

        x:
            a.w * b.x
            + a.x * b.w
            + a.y * b.z
            - a.z * b.y,

        y:
            a.w * b.y
            - a.x * b.z
            + a.y * b.w
            + a.z * b.x,

        z:
            a.w * b.z
            + a.x * b.y
            - a.y * b.x
            + a.z * b.w,

        w:
            a.w * b.w
            - a.x * b.x
            - a.y * b.y
            - a.z * b.z
    };
}


function inverseQuaternion(q) {

    const lengthSquared =
        q.x * q.x
        + q.y * q.y
        + q.z * q.z
        + q.w * q.w;


    if (lengthSquared < 0.000001) {

        return {
            x: 0,
            y: 0,
            z: 0,
            w: 1
        };
    }


    return {

        x: -q.x / lengthSquared,
        y: -q.y / lengthSquared,
        z: -q.z / lengthSquared,
        w:  q.w / lengthSquared
    };
}


function dotQuaternion(a, b) {

    return (
        a.x * b.x
        + a.y * b.y
        + a.z * b.z
        + a.w * b.w
    );
}


function negateQuaternion(q) {

    return {

        x: -q.x,
        y: -q.y,
        z: -q.z,
        w: -q.w
    };
}


// QuaternionでVectorを回す
function rotateVector(q, v) {

    const vectorQuaternion = {

        x: v.x,
        y: v.y,
        z: v.z,
        w: 0
    };


    const result =
        multiplyQuaternion(

            multiplyQuaternion(
                q,
                vectorQuaternion
            ),

            inverseQuaternion(q)
        );


    return {

        x: result.x,
        y: result.y,
        z: result.z
    };
}


// ==================================================
// DeviceOrientation -> Quaternion
// ==================================================
//
// W3C Device Orientationの
// Z-X'-Y'' 回転をQuaternionへ変換
//

function deviceOrientationToQuaternion(
    alpha,
    beta,
    gamma
) {

    const degToRad =
        Math.PI / 180;


    const x =
        beta * degToRad;

    const y =
        gamma * degToRad;

    const z =
        alpha * degToRad;


    const cX =
        Math.cos(x / 2);

    const cY =
        Math.cos(y / 2);

    const cZ =
        Math.cos(z / 2);


    const sX =
        Math.sin(x / 2);

    const sY =
        Math.sin(y / 2);

    const sZ =
        Math.sin(z / 2);


    const q = {

        w:
            cX * cY * cZ
            - sX * sY * sZ,

        x:
            sX * cY * cZ
            - cX * sY * sZ,

        y:
            cX * sY * cZ
            + sX * cY * sZ,

        z:
            cX * cY * sZ
            + sX * sY * cZ
    };


    return normalizeQuaternion(q);
}


// ==================================================
// Basis Matrix -> Quaternion
// ==================================================

function quaternionFromBasis(
    xAxis,
    yAxis,
    zAxis
) {

    // 各軸を回転行列の列として使う

    const m00 = xAxis.x;
    const m01 = yAxis.x;
    const m02 = zAxis.x;

    const m10 = xAxis.y;
    const m11 = yAxis.y;
    const m12 = zAxis.y;

    const m20 = xAxis.z;
    const m21 = yAxis.z;
    const m22 = zAxis.z;


    const trace =
        m00 + m11 + m22;


    let x;
    let y;
    let z;
    let w;


    if (trace > 0) {

        const s =
            Math.sqrt(
                trace + 1
            ) * 2;

        w = 0.25 * s;

        x =
            (m21 - m12) / s;

        y =
            (m02 - m20) / s;

        z =
            (m10 - m01) / s;
    }
    else if (
        m00 > m11
        &&
        m00 > m22
    ) {

        const s =
            Math.sqrt(
                1
                + m00
                - m11
                - m22
            ) * 2;

        w =
            (m21 - m12) / s;

        x =
            0.25 * s;

        y =
            (m01 + m10) / s;

        z =
            (m02 + m20) / s;
    }
    else if (m11 > m22) {

        const s =
            Math.sqrt(
                1
                + m11
                - m00
                - m22
            ) * 2;

        w =
            (m02 - m20) / s;

        x =
            (m01 + m10) / s;

        y =
            0.25 * s;

        z =
            (m12 + m21) / s;
    }
    else {

        const s =
            Math.sqrt(
                1
                + m22
                - m00
                - m11
            ) * 2;

        w =
            (m10 - m01) / s;

        x =
            (m02 + m20) / s;

        y =
            (m12 + m21) / s;

        z =
            0.25 * s;
    }


    return normalizeQuaternion({

        x: x,
        y: y,
        z: z,
        w: w
    });
}


// ==================================================
// Controller Basis
// ==================================================
//
// スマホ自身の軸ではなく、
// 実世界の「上」を基準にした
// コントローラー座標を作る。
//

function createControllerBasis(
    referenceQuaternion
) {

    const worldUp = {

        x: 0,
        y: 0,
        z: 1
    };


    // スマホ画面の右方向
    const phoneRight =
        rotateVector(
            referenceQuaternion,
            {
                x: 1,
                y: 0,
                z: 0
            }
        );


    // スマホ画面の上方向
    const phoneTop =
        rotateVector(
            referenceQuaternion,
            {
                x: 0,
                y: 1,
                z: 0
            }
        );


    // スマホ右方向を水平面へ投影
    let controllerRight = {

        x: phoneRight.x,
        y: phoneRight.y,
        z: 0
    };


    // スマホを横倒しにしてX軸がほぼ垂直になった場合の保険
    if (
        vectorLength(
            controllerRight
        ) < 0.1
    ) {

        const horizontalTop = {

            x: phoneTop.x,
            y: phoneTop.y,
            z: 0
        };


        if (
            vectorLength(
                horizontalTop
            ) > 0.1
        ) {

            controllerRight =
                crossVector(
                    horizontalTop,
                    worldUp
                );
        }
        else {

            controllerRight = {

                x: 1,
                y: 0,
                z: 0
            };
        }
    }


    controllerRight =
        normalizeVector(
            controllerRight
        );


    const controllerUp =
        worldUp;


    // 右手座標系側でのZ軸
    const controllerBack =
        normalizeVector(

            crossVector(
                controllerRight,
                controllerUp
            )
        );


    return quaternionFromBasis(
        controllerRight,
        controllerUp,
        controllerBack
    );
}


// ==================================================
// Sensor
// ==================================================

let currentOrientation = null;

let referenceOrientation = null;

let controllerBasis = null;

let previousSentQuaternion = null;

let sensorStarted = false;

let lastSendTime = 0;

let sequence = 0;


function setReferenceOrientation(
    orientation
) {

    referenceOrientation =
        orientation;


    controllerBasis =
        createControllerBasis(
            referenceOrientation
        );


    previousSentQuaternion =
        null;


    // 持ち方の簡単な表示
    const worldUp = {

        x: 0,
        y: 0,
        z: 1
    };


    const phoneNormal =
        rotateVector(
            referenceOrientation,
            {
                x: 0,
                y: 0,
                z: 1
            }
        );


    const phoneTop =
        rotateVector(
            referenceOrientation,
            {
                x: 0,
                y: 1,
                z: 0
            }
        );


    const flatness =
        Math.abs(
            dotVector(
                phoneNormal,
                worldUp
            )
        );


    const uprightness =
        Math.abs(
            dotVector(
                phoneTop,
                worldUp
            )
        );


    let holdName =
        "斜め持ち";


    if (flatness > 0.75) {

        holdName =
            "水平持ち";
    }
    else if (uprightness > 0.75) {

        holdName =
            "垂直持ち";
    }


    sensorStatus.textContent =
        "基準設定済み / "
        + holdName;
}


function getControllerRotation(
    currentQuaternion
) {

    if (
        referenceOrientation === null
        ||
        controllerBasis === null
    ) {

        return {
            x: 0,
            y: 0,
            z: 0,
            w: 1
        };
    }


    const worldDelta =
        normalizeQuaternion(

            multiplyQuaternion(

                currentQuaternion,

                inverseQuaternion(
                    referenceOrientation
                )
            )
        );


    const controllerRotation =
        normalizeQuaternion(

            multiplyQuaternion(

                multiplyQuaternion(

                    inverseQuaternion(
                        controllerBasis
                    ),

                    worldDelta
                ),

                controllerBasis
            )
        );


    return controllerRotation;
}


function handleOrientation(event) {

    if (
        event.alpha === null
        ||
        event.beta === null
        ||
        event.gamma === null
    ) {

        return;
    }


    const alpha =
        event.alpha;

    const beta =
        event.beta;

    const gamma =
        event.gamma;


    alphaElement.textContent =
        alpha.toFixed(1)
        + "°";

    betaElement.textContent =
        beta.toFixed(1)
        + "°";

    gammaElement.textContent =
        gamma.toFixed(1)
        + "°";


    currentOrientation =
        deviceOrientationToQuaternion(
            alpha,
            beta,
            gamma
        );


    // 最初の姿勢を自動基準にする
    if (
        referenceOrientation === null
    ) {

        setReferenceOrientation(
            currentOrientation
        );
    }


    let controllerRotation =
        getControllerRotation(
            currentOrientation
        );


    if (
        previousSentQuaternion !== null
        &&
        dotQuaternion(
            previousSentQuaternion,
            controllerRotation
        ) < 0
    ) {

        controllerRotation =
            negateQuaternion(
                controllerRotation
            );
    }


    previousSentQuaternion =
        controllerRotation;


    const now =
        performance.now();


    // 最大約60Hz
    if (
        now - lastSendTime
        < 16
    ) {

        return;
    }


    lastSendTime =
        now;


    if (
        socket !== null
        &&
        socket.readyState
        === WebSocket.OPEN
    ) {

        socket.send(

            JSON.stringify({

                type:
                    "orientation",

                x:
                    controllerRotation.x,

                y:
                    controllerRotation.y,

                z:
                    controllerRotation.z,

                w:
                    controllerRotation.w,

                sequence:
                    sequence++,

                time:
                    now
            })
        );
    }
}


async function startSensors() {

    if (sensorStarted) {
        return;
    }


    sensorStatus.textContent =
        "センサー許可を確認中...";


    try {

        if (
            typeof DeviceOrientationEvent
            === "undefined"
        ) {

            sensorStatus.textContent =
                "姿勢センサー非対応";

            return;
        }


        if (
            typeof
            DeviceOrientationEvent
                .requestPermission
            === "function"
        ) {

            const permission =
                await
                DeviceOrientationEvent
                    .requestPermission();


            if (
                permission
                !== "granted"
            ) {

                sensorStatus.textContent =
                    "センサー許可が必要です";

                return;
            }
        }


        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );


        sensorStarted =
            true;


        sensorStatus.textContent =
            "センサー待機中...";
    }
    catch (error) {

        console.error(error);

        sensorStatus.textContent =
            "センサー開始失敗";
    }
}


function calibrate() {

    if (
        currentOrientation === null
    ) {

        return;
    }


    setReferenceOrientation(
        currentOrientation
    );
}


startButton.addEventListener(
    "click",
    startSensors
);


calibrateButton.addEventListener(
    "click",
    calibrate
);


connectWebSocket();

</script>

</body>

</html>
